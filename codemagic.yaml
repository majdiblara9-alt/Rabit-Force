workflows:
  android-workflow:
    name: Build FF Loadout APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Build APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
